name: NailLang current compiler and capability regressions
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.7'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate source-free standard library image
        run: haxe seed-image.hxml
      - name: Verify official versioned modern compiler image (Haxe, Node, PHP)
        run: |
          haxe official-bootstrap-test-interp.hxml
          haxe official-bootstrap-test-js.hxml
          node build/tests/official-bootstrap.js
          haxe official-bootstrap-test-php.hxml
          XDEBUG_MODE=off php build/tests/php-official-bootstrap/index.php
      - name: Verify v0.45 Int / Ratio / Float on Haxe, Node and PHP
        run: |
          haxe modern-numbers-test-interp.hxml
          haxe modern-numbers-test-js.hxml
          node build/tests/modern-numbers.js
          haxe modern-numbers-test-php.hxml
          XDEBUG_MODE=off php build/tests/php-modern-numbers/index.php
      - name: Verify v0.46 Add/Sub/Mul explicit relations on Haxe, JS and PHP
        run: |
          haxe arithmetic-relations-test-interp.hxml
          haxe arithmetic-relations-test-js.hxml
          node build/tests/arithmetic-relations.js
          haxe arithmetic-relations-test-php.hxml
          XDEBUG_MODE=off php build/tests/php-arithmetic-relations/index.php
      - name: Probe modern numeric stdlib bootstrap fixed point in Node
        run: |
          haxe modern-bootstrap-test-js.hxml
          node build/tests/modern-bootstrap.js
      - name: Run text-write tests on Haxe, JS and PHP
        run: |
          haxe host-text-writes-test-interp.hxml
          haxe host-text-writes-test-js.hxml
          node build/tests/host-text-writes.js
          haxe host-text-writes-test-php.hxml
          XDEBUG_MODE=off php build/tests/php-host-text-writes/index.php
      - name: Verify SHA-256 pinned compiled modules on Haxe, JS and PHP
        run: |
          haxe trusted-module-images-test-interp.hxml
          haxe trusted-module-images-test-js.hxml
          node build/tests/trusted-module-images.js
          haxe trusted-module-images-test-php.hxml
          XDEBUG_MODE=off php build/tests/php-trusted-module-images/index.php
      - name: Verify revocable host capabilities on Haxe, JS and PHP
        run: |
          haxe revocable-capabilities-test-interp.hxml
          haxe revocable-capabilities-test-js.hxml
          node build/tests/revocable-capabilities.js
          haxe revocable-capabilities-test-php.hxml
          XDEBUG_MODE=off php build/tests/php-revocable-capabilities/index.php
      - name: Verify Ed25519 signed manifests on Haxe, Node and PHP
        run: |
          haxe signed-manifests-test-interp.hxml
          haxe signed-manifests-test-js.hxml
          node build/tests/signed-manifests.js
          haxe signed-manifests-test-php.hxml
          XDEBUG_MODE=off php build/tests/php-signed-manifests/index.php
      - name: Check inherited read capability and shared-result ABI
        run: |
          haxe host-capabilities-test-interp.hxml
          haxe shared-result-test-interp.hxml
          haxe module-host-grants-test-interp.hxml
          haxe shared-result-test-js.hxml
          node build/tests/shared-result.js
          haxe shared-result-test-php.hxml
          XDEBUG_MODE=off php build/tests/php-shared-result/index.php
      - name: Test offline Ed25519 distribution signing helper
        run: node --test tools/sign-modules.test.mjs
      - name: Verify exact rational rounding on Haxe, JS and PHP
        run: |
          haxe exact-rounding-test-interp.hxml
          haxe exact-rounding-test-js.hxml
          node build/tests/exact-rounding.js
          haxe exact-rounding-test-php.hxml
          XDEBUG_MODE=off php build/tests/php-exact-rounding/index.php
      - name: Verify explicitly declared numerical relations (Haxe, JS, PHP)
        run: |
          haxe explicit-relations-test-interp.hxml
          haxe explicit-relations-test-js.hxml
          node build/tests/explicit-relations.js
          haxe explicit-relations-test-php.hxml
          XDEBUG_MODE=off php build/tests/php-explicit-relations/index.php
      - name: Check Nail-written modern compiler fixed point on Node
        run: |
          haxe rebootstrap-node.hxml
          node build/tests/rebootstrap-node.js
      - name: Test distributed source-free bootstrap runtime (Haxe, Node, PHP)
        run: |
          haxe boot-test-interp.hxml
          haxe boot-test-js.hxml
          node build/tests/boot.js
          haxe boot-test-php.hxml
          XDEBUG_MODE=off php build/tests/php-boot/index.php
      - name: Compile full VM and self-hosted source-free JS/PHP distributions
        run: |
          haxe js.hxml
          haxe php.hxml
          haxe boot-js.hxml
          haxe boot-php.hxml
      - name: Smoke test compiled JS/PHP source-free distributions
        run: |
          node -e 'const {NailSeedBoot}=require("./build/boot/js/nailseed-boot.js"); const result=NailSeedBoot.create().runPlain("nail 0.47 ; 1 / 3 + 1 / 6 ;"); if (JSON.stringify(result)!==JSON.stringify(["R:1/2"])) throw Error(JSON.stringify(result));'
          XDEBUG_MODE=off php build/boot/php/index.php examples/numbers-047.nail
      - uses: actions/upload-artifact@v4
        with:
          name: naillang-current-js-php
          path: |
            build/js/nailseed.js
            build/php/**
            build/boot/js/nailseed-boot.js
            build/boot/php/**
          if-no-files-found: error
