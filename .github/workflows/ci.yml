name: NailLang current compiler and capability regressions
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

# All former regressions are retained. Split by target so expensive PHP
# VM execution cannot block Haxe, Node, or other PHP regression suites.
jobs:
  target-regressions:
    name: regressions (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [haxe, node, php-macro, php-runtime, php-rest]
    steps:
      - uses: actions/checkout@v4
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.7'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run ${{ matrix.target }} regression suite with timings
        shell: bash
        run: bash tools/ci-target.sh "${{ matrix.target }}"

  distributions:
    name: Build and smoke-test source-free distributions
    needs: target-regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.7'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate source-free standard library image
        run: haxe seed-image.hxml
      - name: Verify self-hosted bootstrap and generate distributable image
        shell: bash
        run: |
          haxe rebootstrap-node.hxml
          node build/tests/rebootstrap-node.js
          test -s build/bootstrap/self-image.json
      - name: Compile full VM and self-hosted source-free JS/PHP distributions
        run: |
          haxe js.hxml
          haxe php.hxml
          haxe boot-js.hxml
          haxe boot-php.hxml
      - name: Prove source-free JS/PHP bundles exclude Haxe stage zero
        run: node tools/check-boot-boundary.mjs
      - name: Smoke test compiled JS/PHP source-free distributions
        run: |
          node -e 'const {NailSeed}=require("./build/js/nailseed.js"); const report=NailSeed.analyze("nail 0.50 ; def answer = 42 ; answer ;"); if (!report.ok || report.evaluations.length!==1 || report.evaluations[0].type!=="Int") throw Error(JSON.stringify(report));'
          node -e 'const {NailSeedBoot}=require("./build/boot/js/nailseed-boot.js"); const result=NailSeedBoot.create().runPlain("nail 0.47 ; 1 / 3 + 1 / 6 ;"); if (JSON.stringify(result)!==JSON.stringify(["R:1/2"])) throw Error(JSON.stringify(result));'
          XDEBUG_MODE=off php build/boot/php/index.php examples/numbers-047.nail
          out=$(XDEBUG_MODE=off php build/boot/php/index.php --macro-dir examples/macros examples/macro-next-049.nail)
          php -r 'if (json_decode($argv[1]) !== "I:42/1") exit(1);' "$out"
      - name: Smoke test Dart-to-Nail cookbook examples (source-free JS/PHP)
        run: |
          node -e 'const fs=require("node:fs"); const {NailSeedBoot}=require("./build/boot/js/nailseed-boot.js"); const r=NailSeedBoot.create().runPlain(fs.readFileSync("examples/dart-tour-049.nail","utf8")); if(r.length!==13 || r[0]!=="I:42/1" || r[12]!=="I:42/1" || !Array.isArray(r[1]) || r[1].length!==5) throw Error(JSON.stringify(r));'
          out=$(XDEBUG_MODE=off php build/boot/php/index.php examples/dart-tour-049.nail)
          printf '%s\n' "$out" | php -r '$rows=file("php://stdin", FILE_IGNORE_NEW_LINES); if(count($rows)!==13 || json_decode($rows[0])!=="I:42/1" || json_decode($rows[12])!=="I:42/1") exit(1);'
          # Numeric generic recipes execute correctly through the source-free VM;
          # the current standalone type checker cannot infer every overloaded
          # operator used with unconstrained local type variables.
          # Their runtime behavior is asserted above; type-system regressions
          # are covered by the targeted relations suites.
      - uses: actions/upload-artifact@v4
        with:
          name: naillang-current-js-php
          path: |
            build/js/nailseed.js
            build/php/**
            build/boot/js/nailseed-boot.js
            build/boot/php/**
          if-no-files-found: error

  # Preserve the historical required check name while gating on *all* targets.
  build-and-test:
    name: build-and-test
    if: ${{ always() }}
    needs: [target-regressions, distributions]
    runs-on: ubuntu-latest
    steps:
      - name: Require all regression targets and distributions to pass
        shell: bash
        env:
          REGRESSION_RESULT: ${{ needs.target-regressions.result }}
          DISTRIBUTION_RESULT: ${{ needs.distributions.result }}
        run: |
          test "$REGRESSION_RESULT" = success
          test "$DISTRIBUTION_RESULT" = success
