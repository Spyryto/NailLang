name: Publish v0.39 once (source tag and release assets)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v039-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naillang-v039-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.7'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release source
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$(cat VERSION)" = 0.39
          git merge-base --is-ancestor d6175207ed83f6c62771b3daae58373226861e73 HEAD
      - name: Build and verify before publishing
        run: |
          haxe seed-image.hxml
          haxe host-text-writes-test-interp.hxml
          haxe host-text-writes-test-js.hxml
          node build/tests/host-text-writes.js
          haxe host-text-writes-test-php.hxml
          XDEBUG_MODE=off php build/tests/php-host-text-writes/index.php
          haxe shared-result-test-interp.hxml
          haxe rebootstrap-image.hxml
          haxe js.hxml
          haxe php.hxml
      - name: Package permanent distributions
        run: |
          mkdir -p dist
          (cd build/js && zip -q ../../dist/naillang-v0.39-js.zip nailseed.js)
          (cd build && zip -qr ../dist/naillang-v0.39-php.zip php)
          cp build/bootstrap/stdlib-image.json dist/naillang-v0.39-bootstrap-image.json
      - name: Publish tag and release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.39 >/dev/null 2>&1; then
            echo 'v0.39 release already exists; unchanged.'
            exit 0
          fi
          if ! git ls-remote --exit-code --tags origin refs/tags/v0.39 >/dev/null 2>&1; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/v0.39 -f sha="$GITHUB_SHA"
          fi
          gh release create v0.39 dist/* --verify-tag --title 'NailLang v0.39' --notes 'Controlled opt-in text writes, typed CoreResult, cross-target Haxe/JS/PHP tests, host permission isolation.'
