name: One-time NailLang public history migration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-history.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: naillang-one-time-history-import
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout historical source snapshots
        uses: actions/checkout@v4
        with:
          ref: migration/reconstructed-versions
          path: snapshots
          persist-credentials: false
      - name: Checkout already authorized workflow files
        uses: actions/checkout@v4
        with:
          ref: main
          path: activation
          persist-credentials: false
      - name: Install Haxe for distribution builds
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.7'
      - name: Reconstruct noreply commits, tags and releases
        run: bash snapshots/migration/rebuild-history.sh "$GITHUB_WORKSPACE/snapshots"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
