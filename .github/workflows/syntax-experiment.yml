name: Experimental Nail syntax smoke (isolated branch)
on:
  push:
    branches: [experiments/syntax-curried-keywords]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nail-syntax-${{ github.ref }}
  cancel-in-progress: true
jobs:
  syntax:
    name: Syntax and stdlib - ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [Haxe, JavaScript, PHP]
    steps:
      - uses: actions/checkout@v4
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.7'
      - uses: actions/setup-node@v4
        if: matrix.target == 'JavaScript'
        with:
          node-version: '22'
      - name: Prepare the full experimental stdlib (strict patch)
        run: |
          mkdir -p build/tests
          patch --batch --fuzz=0 -o build/tests/stdlib-experimental.nail stdlib.nail experiments/syntax/stdlib-refactor.patch
      - name: Smoke test full JavaScript build with both library resources
        if: matrix.target == 'JavaScript'
        run: |
          haxe js.hxml -resource build/tests/stdlib-experimental.nail@stdlib-experimental
          node -e 'const {NailSeed}=require("./build/js/nailseed.js"); const src="def inc-all = map using: ( fun n -> n + 1 ) ; inc-all [ 1 , 2 ] ;"; const report=NailSeed.analyzeExperimentalStdlib(src); if (!report.ok || JSON.stringify(NailSeed.runExperimentalStdlib(src))!=="[[2,3]]") throw Error(JSON.stringify(report)); const old=NailSeed.create(); old.loadStdlib(); if(JSON.stringify(old.runPlain("length [ 1 , 2 ] ;"))!=="[2]") throw Error("ordinary stdlib changed"); const stable=NailSeed.analyze("nail 0.61 ; def pair a b = a ; pair b: 2 a: 1 ;"); if(stable.ok) throw Error("experimental syntax leaked into default analyzer");'
      - name: Syntax regression
        run: |
          case "${{ matrix.target }}" in
            Haxe) haxe syntax-experiment-test-interp.hxml ;;
            JavaScript) haxe syntax-experiment-test-js.hxml && node build/tests/syntax-experiment.js ;;
            PHP) haxe syntax-experiment-test-php.hxml && XDEBUG_MODE=off php build/tests/php-syntax-experiment/index.php ;;
          esac
      - name: Self-parser differential (including named calls)
        run: |
          args=(-cp src -main SelfSyntaxExperimentTestMain -resource stdlib.nail@stdlib -resource build/tests/stdlib-experimental.nail@stdlib-experimental)
          case "${{ matrix.target }}" in
            Haxe) haxe "${args[@]}" --interp ;;
            JavaScript) haxe "${args[@]}" -js build/tests/self-syntax.js && node build/tests/self-syntax.js ;;
            PHP) haxe "${args[@]}" -php build/tests/php-self-syntax && XDEBUG_MODE=off php build/tests/php-self-syntax/index.php ;;
          esac
      - name: Stdlib differential
        run: |
          args=(-cp src -main StdlibSyntaxExperimentTestMain -resource stdlib.nail@stdlib -resource build/tests/stdlib-experimental.nail@stdlib-experimental)
          case "${{ matrix.target }}" in
            Haxe) haxe "${args[@]}" --interp ;;
            JavaScript) haxe "${args[@]}" -js build/tests/stdlib-syntax.js && node build/tests/stdlib-syntax.js ;;
            PHP) haxe "${args[@]}" -php build/tests/php-stdlib-syntax && XDEBUG_MODE=off php build/tests/php-stdlib-syntax/index.php ;;
          esac
