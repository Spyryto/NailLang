name: Experimental Nail syntax smoke (isolated branch)
on:
  push:
    branches: [experiments/syntax-curried-keywords]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.7'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Haxe interpreter
        run: haxe syntax-experiment-test-interp.hxml
      - name: JavaScript target
        run: |
          haxe syntax-experiment-test-js.hxml
          node build/tests/syntax-experiment.js
      - name: PHP target
        run: |
          haxe syntax-experiment-test-php.hxml
          XDEBUG_MODE=off php build/tests/php-syntax-experiment/index.php
      - name: Prepare the full experimental stdlib (strict patch)
        run: |
          mkdir -p build/tests
          patch --batch --fuzz=0 -o build/tests/stdlib-experimental.nail stdlib.nail experiments/syntax/stdlib-refactor.patch
      - name: Compare self-parser pipelines and identifiers
        run: |
          haxe -cp src -main SelfSyntaxExperimentTestMain -resource stdlib.nail@stdlib -resource build/tests/stdlib-experimental.nail@stdlib-experimental --interp
          haxe -cp src -main SelfSyntaxExperimentTestMain -resource stdlib.nail@stdlib -resource build/tests/stdlib-experimental.nail@stdlib-experimental -js build/tests/self-syntax.js
          node build/tests/self-syntax.js
          haxe -cp src -main SelfSyntaxExperimentTestMain -resource stdlib.nail@stdlib -resource build/tests/stdlib-experimental.nail@stdlib-experimental -php build/tests/php-self-syntax
          XDEBUG_MODE=off php build/tests/php-self-syntax/index.php
      - name: Compare stdlib on Haxe, JavaScript and PHP
        run: |
          haxe -cp src -main StdlibSyntaxExperimentTestMain -resource stdlib.nail@stdlib -resource build/tests/stdlib-experimental.nail@stdlib-experimental --interp
          haxe -cp src -main StdlibSyntaxExperimentTestMain -resource stdlib.nail@stdlib -resource build/tests/stdlib-experimental.nail@stdlib-experimental -js build/tests/stdlib-syntax.js
          node build/tests/stdlib-syntax.js
          haxe -cp src -main StdlibSyntaxExperimentTestMain -resource stdlib.nail@stdlib -resource build/tests/stdlib-experimental.nail@stdlib-experimental -php build/tests/php-stdlib-syntax
          XDEBUG_MODE=off php build/tests/php-stdlib-syntax/index.php
