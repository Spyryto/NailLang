<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NailSeed v0.17.2 · Playground locale</title>
<style>body{font:16px system-ui,sans-serif;max-width:760px;margin:3rem auto;padding:0 1rem;line-height:1.5}textarea{display:block;width:100%;box-sizing:border-box;min-height:160px;font:15px ui-monospace,monospace;padding:1rem}button{padding:.7rem 1rem;margin-top:1rem;cursor:pointer}pre{padding:1rem;background:#eee;white-space:pre-wrap;overflow-wrap:anywhere}a{color:#1161a7}</style></head>
<body><h1>NailSeed v0.17.2</h1><p>Demo locale del runtime JavaScript. <a href="../LANGUAGE-TOUR.md">Language tour</a> · <a href="../COOKBOOK.md">Cookbook</a>. Prima compila con <code>haxe js.hxml</code>.</p>
<label for="code">Sorgente Nail</label><textarea id="code" spellcheck="false">def twice x = x * 2 ;
twice 21 ;</textarea><button id="run" type="button">Esegui</button><pre id="output" aria-live="polite">Il risultato comparirà qui.</pre>
<script src="../build/js/nailseed.js"></script><script>
'use strict';
const codeEl=document.getElementById('code');
const outputEl=document.getElementById('output');
document.getElementById('run').addEventListener('click',()=>{
  try {const code=codeEl.value; const result=(() => { const vm = NailSeed.create(); vm.loadStdlib(); return vm.runPlain(code); })(); outputEl.textContent=JSON.stringify(result,null,2);}
  catch(error){outputEl.textContent='Errore: '+String(error);}
});
</script></body></html>
